<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺北捷運即時到站看板</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a45c; --gold-dim:#8d7444;
    --scr:#0a1a6b; --scr2:#0b2290; --row:#1238c9; --hd:#06115a;
    --chip:#1f62ff; --chip2:#9fd2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#e9ecef 0%,#c7ccd1 55%,#8f8a80 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:24px 12px;gap:18px;color:#111;
  }
  /* ---------- 機身 ---------- */
  .device{
    width:min(100%,980px);aspect-ratio:16/9.6;container-type:inline-size;
    background:linear-gradient(160deg,#2b2b2d 0%,#161617 45%,#0e0e0f 100%);
    border-radius:2.2cqw;position:relative;
    box-shadow:0 3cqw 5cqw -1cqw rgba(0,0,0,.55),inset 0 .25cqw .3cqw rgba(255,255,255,.08),inset 0 -.4cqw .6cqw rgba(0,0,0,.6);
    display:grid;grid-template-columns:17% 1fr 17%;align-items:stretch;padding:3.2cqw 0;
  }
  .device::after{ /* 霧面質感 */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:.5cqw .5cqw;
  }
  .side{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--gold)}
  .side svg{stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .code{font-family:"Barlow Condensed";font-weight:700;font-size:6.6cqw;letter-spacing:.1cqw;line-height:1;margin-top:1.4cqw}
  .sub{font-family:"Barlow Condensed";font-size:1.45cqw;line-height:1.15;text-align:center;margin-top:.6cqw;color:#d9bd84}
  .sub b{display:block;font-family:"Noto Sans TC";font-weight:700;font-size:1.5cqw;letter-spacing:.2cqw;margin-top:.5cqw}
  .rwy{font-family:"Barlow Condensed";font-weight:700;font-size:2.4cqw;position:absolute;bottom:0;right:3.6cqw}
  /* ---------- 螢幕 ---------- */
  .bezel{background:#050505;border-radius:.8cqw;padding:.9cqw;box-shadow:inset 0 0 .6cqw #000}
  .screen{
    height:100%;border-radius:.3cqw;overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(180deg,var(--scr2),var(--scr));
    display:flex;flex-direction:column;
  }
  .screen::after{ /* 像素/反光 */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%),
      repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);
  }
  .top{display:flex;align-items:center;gap:1cqw;padding:1cqw 1.2cqw .4cqw}
  .tab{font-weight:900;font-size:2.1cqw;padding:.15cqw .7cqw;border-radius:.3cqw;cursor:pointer;
       background:transparent;color:#cfe3ff;border:.15cqw solid #4c7dff;font-family:inherit}
  .tab.on{background:#fff;color:var(--scr2);border-color:#fff}
  .title{font-weight:900;font-size:2.4cqw;letter-spacing:.15cqw;margin-left:.6cqw}
  .clock{margin-left:auto;font-family:"Barlow Condensed";font-weight:700;font-size:2.6cqw;color:#ffe27a;letter-spacing:.1cqw}
  .live{font-family:"Barlow Condensed";font-weight:700;font-size:1.3cqw;padding:.1cqw .5cqw;border-radius:.3cqw;background:#e3342f}
  .live.demo{background:#f59e0b;color:#111}
  .cols,.row{display:grid;grid-template-columns:13% 27% 15% 13% 12% 1fr;align-items:center;padding:0 1.2cqw;column-gap:.6cqw}
  .cols{padding-top:.3cqw;padding-bottom:.5cqw;border-bottom:.15cqw solid rgba(255,255,255,.25)}
  .cols div{font-weight:700;font-size:1.75cqw;line-height:1.05}
  .cols small{display:block;font-family:"Barlow Condensed";font-weight:500;font-size:1.2cqw;color:#9fc0ff}
  .rows{flex:1;display:flex;flex-direction:column;perspective:60cqw}
  .row{flex:1;min-height:0;transform-origin:50% 0}
  .row:nth-child(even){background:linear-gradient(90deg,var(--row),#1745e0 60%,var(--row))}
  .row.flip{animation:flip .55s cubic-bezier(.3,.7,.3,1) both}
  @keyframes flip{0%{transform:rotateX(-90deg);opacity:.2}60%{transform:rotateX(12deg);opacity:1}100%{transform:rotateX(0)}}
  .t{font-family:"Barlow Condensed";font-weight:700;font-size:2.7cqw;line-height:1}
  .t i{display:block;font-style:normal;font-size:1.4cqw;color:#ffe27a}
  .dest{font-weight:700;font-size:2.5cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dest small{display:block;font-family:"Barlow Condensed";font-weight:500;font-size:1.35cqw;color:#bcd3ff}
  .fn{font-family:"Barlow Condensed";font-weight:600;font-size:2.2cqw;color:#dbe7ff}
  .al{justify-self:start;font-family:"Barlow Condensed";font-weight:700;font-size:1.8cqw;background:var(--chip);
      border-radius:.35cqw;padding:.15cqw .7cqw;min-width:4.6cqw;text-align:center;line-height:1.15}
  .al small{display:block;font-family:"Noto Sans TC";font-size:1.05cqw;font-weight:500;line-height:1}
  .gate{justify-self:start;font-family:"Barlow Condensed";font-weight:700;font-size:2.4cqw;color:var(--scr2);
        background:var(--chip2);border-radius:.5cqw;min-width:4.4cqw;text-align:center;padding:.05cqw .5cqw}
  .gate.empty{background:transparent;color:#7f9de0}
  .st{font-weight:900;font-size:2.2cqw;white-space:nowrap}
  .st.ok{color:#fff}.st.go{color:#7CFFB2}.st.board{color:#7CFFB2;animation:blink 1s steps(2) infinite}
  .st.late{color:#ffd24d}.st.cxl{color:#ff6b6b}
  @keyframes blink{50%{opacity:.25}}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:.45cqw 1.2cqw;background:var(--hd);
        font-family:"Barlow Condensed";font-size:1.3cqw;color:#9fc0ff}
  .dots span{display:inline-block;width:.8cqw;height:.8cqw;border-radius:50%;background:#33457d;margin-left:.4cqw}
  .dots span.on{background:#ffe27a}
  .empty-msg{flex:1;display:flex;align-items:center;justify-content:center;font-size:2.2cqw;color:#9fc0ff}
  .note{max-width:980px;font-size:13px;color:#333;text-align:center;line-height:1.6}
  .note code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
  .fs{position:fixed;right:14px;bottom:14px;border:0;border-radius:999px;padding:8px 14px;font:600 13px "Noto Sans TC";
      background:#111;color:var(--gold);cursor:pointer;opacity:.75}
  body.full{padding:0;background:#000}
  body.full .note,body.full .fs{display:none}
  body.full .device{width:min(100vw,calc(100vh*16/9.6));border-radius:0}

  /* ---- 捷運專用 ---- */
  .cols,.row{grid-template-columns:38% 31% 1fr}
  .tab{font-family:"Barlow Condensed";font-size:2.2cqw;padding:.05cqw .6cqw;min-width:3.4cqw;text-align:center}
  .tab.on{color:#fff;border-color:#fff}
  .title{cursor:default;white-space:nowrap}
  .title small{font-family:"Barlow Condensed";font-weight:500;font-size:1.4cqw;color:#9fc0ff;margin-left:.5cqw}
  .ar{background:transparent;border:0;color:#9fc0ff;font-size:2.4cqw;cursor:pointer;padding:0 .4cqw;font-family:inherit}
  .eta{font-family:"Barlow Condensed";font-weight:700;font-size:2.7cqw;line-height:1}
  .eta small{font-family:"Noto Sans TC";font-size:1.3cqw;color:#bcd3ff;margin:0 .4cqw 0 .1cqw;font-weight:500}
  .lc{justify-self:start;font-weight:700;font-size:1.6cqw;border-radius:.35cqw;padding:.15cqw .7cqw;color:#fff;line-height:1.2}
  .st.soon{color:#7CFFB2}
  .linebar{display:flex;gap:.7cqw;padding:.1cqw 1.2cqw .5cqw;flex-wrap:wrap}
  .lb{font-family:"Noto Sans TC";font-weight:700;font-size:1.7cqw;padding:.15cqw .9cqw;border-radius:.4cqw;cursor:pointer;
      background:transparent;color:#e6efff;border:.18cqw solid var(--c);line-height:1.2}
  .lb.on{background:var(--c);color:#fff;border-color:#fff}
  .lb:hover{background:rgba(255,255,255,.14)}
  .lb.on:hover{background:var(--c)}
  .autob{background:transparent;border:.12cqw solid #4c7dff;border-radius:.4cqw;color:#cfe3ff;font:inherit;font-family:"Noto Sans TC";font-weight:700;font-size:1.3cqw;padding:.1cqw .8cqw;margin-right:1cqw;cursor:pointer}
  .autob.on{border-color:#ffe27a;color:#ffe27a}
  .autob:hover{background:rgba(255,255,255,.12)}
</style>
</head>
<body>

<div class="device" id="dev">
  <!-- 左側：TRTC 識別 + 台北101剪影 -->
  <div class="side">
    <svg viewBox="0 0 60 60" style="width:7cqw;margin-top:.6cqw"><rect x="13" y="6" width="34" height="40" rx="9"/><path d="M13 26h34M20 12h20M21 36h.1M39 36h.1M21 46l-7 9M39 46l7 9M24 50h12"/></svg>
    <div class="code">MRT</div>
    <div class="sub">Taipei Metro<br>Real-time<b>臺北捷運</b></div>
    <svg viewBox="0 0 120 90" style="width:9cqw;position:absolute;bottom:0">
      <!-- 台北101意象：八節塔 -->
      <path d="M60 2v10M56 12h8"/><path d="M52 12h16l-3 10H55z"/>
      <path d="M50 22h20l-2 9H52z"/><path d="M48 31h24l-2 9H50z"/><path d="M46 40h28l-2 9H48z"/>
      <path d="M44 49h32l-2 9H46z"/><path d="M42 58h36l-2 9H44z"/><path d="M40 67h40l-1 9H41z"/><path d="M34 76h52v10H34z"/><path d="M10 86h100"/>
    </svg>
  </div>

  <div class="bezel">
    <div class="screen">
      <div class="top">
        <span id="tabs" style="display:flex;gap:.6cqw"></span>
        <div class="title"><button class="ar" id="prev">‹</button><span id="sname">—</span><button class="ar" id="next">›</button></div>
        <span class="live demo" id="live">DEMO</span>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="linebar" id="linebar"></div>
      <div class="cols">
        <div>車站<small>Station</small></div>
        <div id="hA">—<small>Direction</small></div>
        <div id="hB">—<small>Direction</small></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="foot"><span id="upd">—</span><span><button class="autob on" id="auto">⏸ 關閉自動輪播</button><span class="dots" id="dots"></span></span></div>
    </div>
  </div>

  <!-- 右側：捷運站標誌 + 軌道 -->
  <div class="side">
    <svg viewBox="0 0 40 90" style="width:5.6cqw;margin-top:.6cqw">
      <circle cx="20" cy="16" r="13"/><path d="M11 24V9l9 9 9-9v15"/>
      <path d="M20 29v57M12 86h16"/><path d="M20 50h0"/>
    </svg>
    <svg viewBox="0 0 80 90" style="width:12cqw;position:absolute;bottom:2.8cqw">
      <!-- 軌道透視：兩條鋼軌 + 枕木 -->
      <path d="M32 4 10 88M48 4l22 84"/><path d="M36 4 18 88M44 4l18 84"/>
      <path d="M33 14h14M30 28h20M27 44h26M23 62h34M19 80h42"/>
    </svg>
    <div class="rwy" id="sid">--</div>
  </div>
</div>

<p class="note" id="note"></p>
<button class="fs" id="fsBtn">全螢幕</button>

<script>
const API='/api/metro', PER_PAGE=6, PAGE_MS=8000;
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let stlist=[],isDemo=true,line=LS('m_line')||'TRTC:BL',page=0,auto=true,demoTrains=[];
const cache={};

function demo(){
  const names=['頂埔','永寧','土城','海山','亞東醫院','府中','板橋','新埔','江子翠','龍山寺','西門','台北車站','善導寺','忠孝新生'];
  stlist=names.map((n,i)=>({op:'TRTC',group:'北捷',key:'TRTC:BL',color:'#0070bd',id:'BL'+pad(i+1),name:n,en:'',line:'BL',lineName:'板南線'}));
  demoTrains=[['BL03','往南港展覽館',0],['BL11','往頂埔',95],['BL07','往南港展覽館',140],['BL12','往頂埔',20]].map(([id,h,sec])=>({line:'BL',lineName:'板南線',id,head:h,sec,status:0}));
  cache['TRTC:BL']={trains:demoTrains,at:Date.now(),ok:true};
}
async function ensure(l){
  if(isDemo||!l)return;
  const c=cache[l];
  if(c&&(c.pending||Date.now()-c.at<15000))return;
  cache[l]=Object.assign(c||{trains:[]},{pending:true});
  try{
    const [op,ln]=l.split(':');const r=await fetch(`${API}?op=${op}&line=${ln}`,{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();cache[l]={trains:j.trains||[],at:Date.now(),ok:true};
  }catch(e){cache[l]=Object.assign(cache[l],{pending:false,at:Date.now()})}
  if(l===line)render(false);
}
async function load(){
  try{
    const r=await fetch(`${API}?stations=1`,{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();if(!j.stations||!j.stations.length)throw 0;
    stlist=j.stations;isDemo=false;
  }catch(e){if(!stlist.length){demo();isDemo=true}}
  const lv=$('live');lv.textContent=isDemo?'DEMO':'LIVE';lv.classList.toggle('demo',isDemo);
  $('note').innerHTML=isDemo?'目前顯示<b>示範資料</b>。部署到 Vercel 並設定 <code>TDX_CLIENT_ID</code> / <code>TDX_CLIENT_SECRET</code> 後會自動切換為 TDX 即時資料。':'資料來源：交通部 TDX 運輸資料流通服務・臺北捷運列車即時到站，每 15 秒更新。TDX 只提供「目前正在進站或即將進站」的列車，沒有即時列車的車站，會依時刻表推算「約 N 分」。';
  buildTabs();render(false);
}
const lines=()=>{const m=new Map();stlist.forEach(t=>{if(!m.has(t.key))m.set(t.key,{key:t.key,group:t.group,name:t.lineName,color:t.color,code:t.line,op:t.op})});return [...m.values()]};
const cur_=()=>lines().find(l=>l.key===line)||lines()[0]||{key:line,group:'',name:'',color:'#1f62ff',code:'',op:''};
const stations=()=>stlist.filter(s=>s.key===line).sort((a,b)=>a.id.localeCompare(b.id,'en',{numeric:true}));
function buildTabs(){
  if(!lines().find(l=>l.key===line))line=(lines()[0]||{key:line}).key;
  const gs=[...new Set(lines().map(l=>l.group))],cg=cur_().group;
  $('tabs').innerHTML=gs.map(g=>`<button class="tab${g===cg?' on':''}" data-g="${g}" style="${g===cg?`background:${cur_().color};border-color:#fff`:''}">${g}</button>`).join('');
  $('linebar').innerHTML=lines().filter(l=>l.group===cg).map(l=>`<button class="lb${l.key===line?' on':''}" data-k="${l.key}" style="--c:${l.color}">${l.name}</button>`).join('');
}
const tt={};
async function ensureTT(op){
  const c=tt[op];
  if(isDemo||(c&&(c.ok||Date.now()-c.at<60000)))return;
  tt[op]={at:Date.now(),idx:{}};
  try{
    const r=await fetch(`${API}?timetable=${op}`);if(!r.ok)throw 0;
    const j=await r.json(),idx={};
    j.list.forEach(x=>{(idx[x.s]=idx[x.s]||[]).push(x)});
    tt[op]={ok:true,at:Date.now(),idx};render(false);
  }catch(e){}
}
function estimate(s,isA,pos){
  const c=tt[s.op];if(!c||!c.ok)return null;
  const now=new Date(),dow=now.getDay(),nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  let best=null;
  (c.idx[s.id]||[]).forEach(x=>{
    if(x.days[dow]!=='1')return;
    const di=pos[x.d];if(di===undefined||(di>pos[s.id])!==isA)return;
    x.t.forEach(m=>{const d=m*60-nowSec;if(d>=0&&(best===null||d<best))best=d});
  });
  return best;
}
function cell(trs,left,s,isA,pos){
  const t=trs.filter(x=>x.status===0&&x.sec!=null).sort((a,b)=>a.sec-b.sec)[0];
  if(!t){
    const e=estimate(s,isA,pos);
    if(e===null)return '<span class="st" style="color:#6f8ad6">—</span>';
    return e<60?'<span class="st soon">即將進站</span>':`<span class="eta" style="color:#bcd3ff"><small>約</small>${Math.ceil(e/60)}<small>分</small></span>`;
  }
  const l=Math.max(0,t.sec-left);
  return l<=30?'<span class="st board">進站中</span>':`<span class="eta">${Math.floor(l/60)}<small>分</small>${pad(l%60)}<small>秒</small></span>`;
}
function render(animate=true){
  ensure(line);ensureTT(cur_().op);
  const ss=stations(), pos=Object.fromEntries(ss.map((x,i)=>[x.id,i])), pages=Math.max(1,Math.ceil(ss.length/PER_PAGE));
  if(page>=pages)page=0;
  const cur=cache[line]||{trains:[],at:Date.now()};
  const age=Math.floor((Date.now()-cur.at)/1000);
  const d=new Date(cur.at);$('upd').textContent=`UPDATED ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} · ${isDemo?'DEMO DATA':'SOURCE: TDX'} · ${page+1}/${pages}`;
  $('sname').innerHTML=`${cur_().name}<small>${ss.length} 站</small>`;
  $('sid').textContent=cur_().code;
  const A=ss.length?ss[ss.length-1].name:'',B=ss.length?ss[0].name:'';
  $('hA').innerHTML=`往${A}<small>Direction</small>`;$('hB').innerHTML=`往${B}<small>Direction</small>`;
  const slice=ss.slice(page*PER_PAGE,page*PER_PAGE+PER_PAGE);
  $('rows').innerHTML=slice.map((s,i)=>{
    const here=cur.trains.filter(t=>t.id===s.id);
    const toA=here.filter(t=>(t.head||'').includes(A)), toB=here.filter(t=>!(t.head||'').includes(A));
    return `<div class="row${animate?' flip':''}" style="animation-delay:${i*70}ms">
      <div class="dest"><span class="lc" style="background:${cur_().color};margin-right:.8cqw;font-family:'Barlow Condensed';font-size:1.8cqw">${s.id}</span>${s.name}<small>${s.en}</small></div>
      <div>${cell(toA,age,s,true,pos)}</div><div>${cell(toB,age,s,false,pos)}</div></div>`}).join('')
    +'<div class="row" style="visibility:hidden"></div>'.repeat(Math.max(0,PER_PAGE-slice.length));
  $('dots').innerHTML=Array.from({length:pages},(_,i)=>`<span class="${i===page?'on':''}"></span>`).join('');
}
function nextLine(d){const ls=lines().map(l=>l.key);const i=ls.indexOf(line);line=ls[(i+d+ls.length)%ls.length];LS('m_line',line);page=0;buildTabs();render()}
function prevPage(){if(page>0){page--;render()}else{nextLine(-1);page=Math.max(0,Math.ceil(stations().length/PER_PAGE)-1);render()}}
function nextPage(){const pages=Math.max(1,Math.ceil(stations().length/PER_PAGE));if(page+1>=pages)nextLine(1);else{page++;render()}}
function setAuto(v){auto=v;const b=$('auto');b.classList.toggle('on',v);b.textContent=v?'⏸ 關閉自動輪播':'▶ 開啟自動輪播'}
$('prev').onclick=()=>{setAuto(false);nextLine(-1)};
$('next').onclick=()=>{setAuto(false);nextLine(1)};
$('auto').onclick=()=>setAuto(!auto);
$('linebar').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;line=b.dataset.k;LS('m_line',line);page=0;setAuto(false);buildTabs();render()};
$('tabs').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;line=lines().find(l=>l.group===b.dataset.g).key;LS('m_line',line);page=0;setAuto(false);buildTabs();render()};
function tick(){const d=new Date();$('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;render(false)}
setInterval(()=>{if(auto)nextPage()},PAGE_MS);
// 左右滑動換頁（手機觸控、滑鼠拖曳皆可）；左滑＝下一頁、右滑＝上一頁
(()=>{const el=document.querySelector('.screen');let x0=null,y0=0;
  el.style.touchAction='pan-y';el.style.userSelect='none';
  el.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY});
  el.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){setAuto(false);dx<0?nextPage():prevPage()}});
  el.addEventListener('pointercancel',()=>{x0=null});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){setAuto(false);prevPage()}if(e.key==='ArrowRight'){setAuto(false);nextPage()}});
})();
setInterval(load,3600000);setInterval(tick,1000);
$('fsBtn').onclick=async()=>{document.body.classList.add('full');try{await document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('full')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('full')});
tick();load();
</script>
</body>
</html>
